[project]
name = "mk20deck"
version = "0.1.0"
description = "MK20 Agent Deck P0: Codex Desktop / herdr / tmux status deck for Waveshare MK20 B"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
via = ["hidapi>=0.14"]

[project.scripts]
mk20deck = "mk20deck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mk20deck*"]

[tool.setuptools.package-data]
mk20deck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
