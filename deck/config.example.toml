# ~/.config/mk20-agent-deck/config.toml  (all keys optional)
[deck]
default_mode = "codex_desktop"   # first run only; afterwards the last used mode is remembered
port = "auto"                    # or "/dev/cu.usbmodemXXXX"
fw_coord_base = "auto"           # firmware col/row base: "auto" (infer from getInfo rects), 0 or 1 (PRD D12)
max_fps = 8                      # global ceiling (PRD §7.4); clamped to <= 8
animations = true
jpeg_quality = 85
poll_interval_s = 2.0
background_poll_s = 10           # other modes are polled in the background for "tmux 2 待处理"; 0 = off
heartbeat_s = 2.0
backlight = 80                   # sent after every handshake (host mode starts at 0 = dark); false = leave alone
web_url = "http://172.30.250.2:8780/"  # opened on the Mac by the 网页设置 key (device event ui.openSettings);
                                 # http/https, IP literal or localhost, no credentials - else this default
approve_hold_s = 1.0             # option mode, permission prompt: hold 「是」/「是，且不再问」 this long (0..5 s);
                                 # 0 = off (the keyboard types the digit on press, as before 1.8.1)
approve_sound = "Glass"          # /System/Library/Sounds/<name>.aiff after an approve; "" = silent

[snap]                           # L4: long press MODE = screenshot to the clipboard (needs Screen Recording)
save_dir = ""                    # also keep a PNG here (e.g. "~/Pictures/mk20"); "" = clipboard only

[web]
arrange_port = 8781              # 会话安排 page (http://127.0.0.1:8781/, 127.0.0.1 only); 0 = off. Open it with
                                 # `mk20deck arrange` (one-time link via $MK20DECK_HOME/run/arrange.sock, 0600)
                                 # or the keyboard's LS 会话安排 key (fw >= 1.6.0; 0 = the key only shows a toast).
                                 # A busy port only logs one warning. Rules: $MK20DECK_HOME/slot-rules.json

[codex_desktop]
codex_home = "~/.codex"
originators = ["Codex Desktop", "codex_work_desktop", ""]
running_window_s = 600           # task_started without completion older than this -> unknown
max_candidates = 24
max_prompt_chars = 2000          # skill prefill: fail (never truncate) beyond this
# K1 scroll-back in Codex Desktop goes through the helper `mk20deck scroll-setup` installs (only it has Accessibility)
scroll_app = "com.openai.codex"  # bundle id (or name) of the App whose frontmost window is scrolled
scroll_via = "pid"               # "pid" = straight into the App (cursor untouched); "hid" = system event tap
scroll_helper = ""               # "" = $MK20DECK_HOME/bin/mk20deck-scroll

[tmux]
patterns = ["ag-ccai-*", "ag-codex-*", "ag-kimi-*"]
registered_panes = []
agent_commands = ["claude", "codex", "kimi"]  # pane_current_command values listed as agent panes
use_hooks = true                 # state from tools/hooks/mk20-agent-state-hook.py records (README「需要我的 agent」)
state_dir = ""                   # "" = $MK20DECK_HOME/agent-state (~/.config/mk20-agent-deck/agent-state)
hook_max_age_s = 43200           # ignore hook records older than this
running_stale_s = 900            # "running" without any hook event for this long -> unknown
terminal_app = ""                # e.g. "Ghostty"; empty -> focus disabled ("请绑定终端 App")
new_session_cmd = ""             # e.g. "ccai sg"; empty -> new-session key disabled

[herdr]
binary = "herdr"

# Knob events: CDC vs HID path is unverified (PRD §6.4). Map firmware "col,row" from
# keyStateChanged to knob actions once measured, e.g.:
# [knobs]
# "5,0" = "K1:press"
# "6,0" = "K1:cw"

# [[skills]]  # legacy: the 1.5 key layout has no skill keys; still accepted (four entries) and ignored
# label = "审 PR"
# prompt = "请审查当前分支相对主干的改动……"
